<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>FULL</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    .container {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      grid-template-rows: repeat(auto-fill, minmax(80px, 1fr));
      place-items: center;
    }

    .finger {
      font-size: 60px;
      animation: shake 0.2s infinite;
      user-select: none;
    }

    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
      75% { transform: rotate(-5deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- JS 없이도 자동 채움 -->
    <script>
      const count = Math.floor((window.innerWidth / 80) * (window.innerHeight / 80));
      document.write("🖕".repeat(count).split("").map(e => `<div class='finger'>${e}</div>`).join(""));
    </script>
  </div>
</body>
</html>
