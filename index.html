<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>FULL</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
  }

  #container {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    grid-template-rows: repeat(auto-fill, minmax(70px, 1fr));
    place-items: center;
    animation: flash 0.5s infinite;
  }

  .finger {
    user-select: none;
    animation: shake 0.15s infinite;
  }

  @keyframes shake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
    75% { transform: rotate(-10deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes flash {
    0% { background: black; }
    50% { background: #111; }
    100% { background: black; }
  }
</style>
</head>
<body>

<div id="container"></div>

<audio id="sound" autoplay loop>
  <source src="https://www.myinstants.com/media/sounds/windows-error.mp3" type="audio/mpeg">
</audio>

<script>
  const container = document.getElementById("container");

  function random(min, max) {
    return Math.random() * (max - min) + min;
  }

  function randomColor() {
    return `hsl(${Math.random() * 360}, 100%, 60%)`;
  }

  function createFinger() {
    const d = document.createElement("div");
    d.className = "finger";
    d.textContent = "🖕";
    d.style.fontSize = random(30, 90) + "px";
    d.style.color = randomColor();
    return d;
  }

  function fillScreen(multiplier = 1) {
    const count = Math.floor(
      (window.innerWidth / 70) * (window.innerHeight / 70) * multiplier
    );
    for (let i = 0; i < count; i++) {
      container.appendChild(createFinger());
    }
  }

  // 최초 채우기
  fillScreen();

  // 클릭하면 폭증
  document.addEventListener("click", () => {
    fillScreen(2);
    if (navigator.vibrate) navigator.vibrate(200);
    document.documentElement.requestFullscreen?.();
  });

  // 모바일 회전 대응
  window.addEventListener("resize", () => {
    container.innerHTML = "";
    fillScreen();
  });
</script>

</body>
</html>
